# ============================================================
# PAYMENT SERVICE CONFIGURATION
# ============================================================
# Port: 8085
# Database: H2 in-memory (paymentdb)
# Kafka: Consumer (enrollment-events) + Producer (payment-events)
# ============================================================
# This service is triggered AUTOMATICALLY by Kafka events.
# No one calls it via REST to create payments — it reacts
# to enrollment-events and processes payments asynchronously.
#
# This is a key event-driven architecture pattern:
#   "React to events, don't wait for commands"
# ============================================================

server:
  port: 8085

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.enrollment.paymentservice.dto.EnrollmentEvent
      auto-offset-reset: earliest
